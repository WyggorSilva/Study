<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Aula 04 - Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <h2>Pesquisa de satisfação da pizzaria do Wyggor:</h2>
    <form>
        <div>
            <label for="name">Seu Nome:</label>
            <input id="name" type="text" placeholder="Digite o seu nome..." required/>
        </div>
        <div>
            <label for="email">Seu E-mail:</label>
            <input id="email" type="email" placeholder="Digite o seu e-mail..." required/>
        </div>
        <div>
            <label for="gender">Seu Gênero:</label>
            <select id="gender" name="gender">
                <option value="none">-------------</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
        </div>

        <fieldset>
            <legend>O que achou do nosso produto?</legend>
            <div>
                <input type="radio" id="good" name="opinion" value="good" required/>
                <label for="good">Bom</label>
            </div>
            <div>
                <input type="radio" id="bad" name="opinion" value="bad" required/>
                <label for="bad">Ruim</label>
            </div>
            <div>
                <input type="radio" id="indifferent" name="opinion" value="indifferent" required/>
                <label for="indifferent">Indiferente</label>
            </div>
        </fieldset>

         <fieldset id="pizzas">
            <legend>Quais sabores das pizzas você compraria novamente?</legend>
            <div>
                <input type="checkbox" id="calabresa" name="pizza" value="calabresa"/>
                <label for="calabresa">Calabresa</label>
            </div>
            <div>
                <input type="checkbox" id="mussarela" name="pizza" value="mussarela"/>
                <label for="mussarela">Mussarela</label>
            </div>
            <div>
                <input type="checkbox" id="portuguesa" name="pizza" value="portuguesa"/>
                <label for="portuguesa">Portuguesa</label>
            </div>
            <div>
                <input type="checkbox" id="frango" name="pizza" value="frango"/>
                <label for="frango">Frango</label>
            </div>
            <div>
                <input type="checkbox" id="carneseca" name="pizza" value="carneseca"/>
                <label for="carneseca">Carne Seca</label>
            </div>
            <div>
                <input type="checkbox" id="baconcommilho" name="pizza" value="baconcommilho"/>
                <label for="baconcommilho">Bacon Com Milho</label>
            </div>
        </fieldset>
        <div>
            <label for="message">Tem algo a mais a nós dizer?</label>
            <textarea id="message"></textarea>
        </div>
        <button>Enviar Formulário</button>
    </form>
    <script src="form.js"></script>
</body>
</html>

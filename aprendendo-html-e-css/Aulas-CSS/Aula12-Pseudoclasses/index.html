<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aula 12 - PseudoClasess no CSS</title>
</head>
<body>
    <h1>Pseudoclasses no CSS</h1>
    <h2>:hover e :focus</h2>
        <div class="buttons">
            <button>Botão 1</button>
            <button>Botão 2</button>
            <button>Botão 3</button>
            <button>Botão 4</button>
            <button>Botão 5</button>
        </div>
    <input type="text" placeholder="Digite seu nome:">
    <h2> :first-child e :last-child</h2>
        <div class="texts">
            <p>Texto 1</p>
            <p>Texto 2</p>
            <p>Texto 3</p>
            <p>Texto 4</p>
            <p>Texto 5</p>
        </div>
    <h2>:nth-child(n)</h2>
        <div class="images">
            <img src="assets/lipe.jpg">
            <img src="assets/lipe.jpg">
            <img src="assets/lipe.jpg">
            <img src="assets/lipe.jpg">
            <img src="assets/lipe.jpg">
        </div>
</body>
</html>

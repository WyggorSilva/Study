<!DOCTYPE html>
<html lang="pt=BR">
    <head>
        <title>Aula 04 - Definindo cores e tamanhos</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <section>
            <h1>Tamanhos e Cores</h1>
            <div>
                <p>O tamanho padrão do P é 16px</p>
                <p id="hexadecimal">Cor Hexadecimal</p>
                <p id="rgb">Cor RGB</p>
                <p id="rgba">Cor RGBA</p>
                <p id="corNome">Cor Nome</p>
            </div>
        </section>

        <section>
            <p>Esse texto tem o tamanho padrão 16px</p>
            <p id="porcentagem">Esse texto tem 50% do tamanho padrão</p>
            <p id="em">Esse texto tem 2em</p>
            <p id="rem">Esse texto tem 2 o rem</p>
        </section>
        <div>
            <p id="caixa">CAIXA</p>
        </div>
    </body>
</html>
